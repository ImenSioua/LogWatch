input {
  beats {
    port => 5044
  }
  generator {
    lines => [
      "2026-11-08T20:10:00Z INFO webapp Demarrage de l'application",
      "2026-11-08T20:10:05Z WARN webapp Temps de reponse eleve",
      "2026-11-08T20:10:09Z ERROR mongodb Connexion refusee"
    ]
    count => 1
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:level} %{WORD:service} %{GREEDYDATA:log_message}" }
  }
  date {
    match => ["log_timestamp", "ISO8601"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logwatch-test-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
