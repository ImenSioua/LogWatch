input {
  beats {
    port => 5044
  }
  file {
    path => "/data/logs_input/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_logwatch"
    codec => "json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  fingerprint {
    source => ["timestamp", "service", "ip", "user", "message", "response_time_ms"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][fingerprint]"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logwatch-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
